[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sociolinguistic-invariance"
version = "0.1.0"
description = "A replication-first framework for evaluating language-model behavior across sociolinguistic variation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema",
]
anthropic = [
    "anthropic>=1.4,<2",
]
dashboard = [
    "streamlit>=1.41,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true